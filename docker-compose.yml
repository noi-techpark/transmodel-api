services:
  transmodel:
    build:
      dockerfile: infrastructure/docker/Dockerfile
      context: . 
      target: dev
    env_file:
      - .env
    volumes:
      - ./src:/code
      - pkg:/go/pkg/mod
      - ./src/provider/testdata/skyalps.xml:/shared/skyalps.xml
    working_dir: /code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
    tty: true
    ports:
      - ${SERVER_PORT}:8080
        
  # Runs xml validation
  validate:
    depends_on:
      transmodel:
        condition: service_healthy
    profiles: [validate]
    build:
      dockerfile: test/validate.dockerfile
      context: . 
    environment:
      ENDPOINT: transmodel:8080
      TMPFILE: /val/test/validate.xml
    entrypoint: ./validate.sh
    working_dir: /val/test
    volumes:
      - ./:/val

  # Runs unit tests
  test:
    build:
      dockerfile: infrastructure/docker/Dockerfile
      context: . 
      target: test
    profiles: [test]
    working_dir: /code
    volumes:
      - ./src:/code
      - pkg:/go/pkg/mod
    tty: true

  swagger:
    profiles: [swagger]
    image: swaggerapi/swagger-ui:v5.17.4
    ports:
      - 8001:8080
    environment:
      URL: http://localhost:8000/apispec
    attach: false

  gtfs2netex:
    image: ghcr.io/noi-techpark/gtfs2netex-api/gtfs2netex-api:${GTFS2NETEX_TAG}
    pull_policy: always
    restart: unless-stopped
        
volumes:
  pkg:
