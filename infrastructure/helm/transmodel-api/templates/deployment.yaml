apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transmodel-api.name" . }}
  labels:
    {{- include "transmodel-api.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "transmodel-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transmodel-api.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "8000"
            - name: GTFS2NETEX_URL
              value: "http://localhost:8080"
          {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: gtfs2netex
          image: "{{ .Values.gtfs2netex.image }}:{{ .Values.gtfs2netex.tag }}"
