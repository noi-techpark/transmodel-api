services:
  transmodel:
    image: ${DOCKER_IMAGE}:${DOCKER_TAG}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://app:8080/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - ${SERVER_PORT}:8080

  gtfs2netex:
    image: ghcr.io/noi-techpark/gtfs2netex-api/gtfs2netex-api:1.0
    restart: unless-stopped
